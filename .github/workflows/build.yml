name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build (MSVC x86)
        shell: cmd
        run: build.bat

      - name: Verify artifacts
        shell: pwsh
        run: |
          $files = @(
            "bin\pivotkit.dll",
            "bin\pivotkit-loader.exe"
          )

          foreach ($f in $files) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing artifact: $f"
              exit 1
            }
          }

          # Confirm the loader is a 32-bit PE.
          $bytes = [System.IO.File]::ReadAllBytes("bin\pivotkit-loader.exe")
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)

          if ($machine -ne 0x14C) {
            Write-Error ("loader is not x86 (machine=0x{0:X})" -f $machine)
            exit 1
          }

          Write-Host "Artifacts OK (x86 loader, dll present)"

      - name: Build Lua test runner
        shell: cmd
        run: tools\make_lua_test.cmd

      - name: Run Lua tests
        shell: cmd
        run: |
          bin\lua.exe tests\pivotlib_test.lua
          bin\lua.exe tests\demo_smoke.lua

      - name: Smoke test (syntax only)
        shell: pwsh
        run: |
          $luaExe = Get-Command luac, lua -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $luaExe) {
            Write-Host "lua not installed; skipping mod syntax check"
            return
          }

          Get-ChildItem mods\*.lua | ForEach-Object {
            & $luaExe.Source -p $_.FullName
            if ($LASTEXITCODE -ne 0) {
              exit 1
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pivotkit-${{ github.sha }}
          path: |
            bin/pivotkit.dll
            bin/pivotkit-loader.exe
            mods/*
            tools/pivotctl.py
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Release tags must use vMAJOR.MINOR.PATCH: $tag"
            exit 1
          }

          $version = $tag.Substring(1)
          $heading = "^## \[$([regex]::Escape($version))\]"
          if (-not (Select-String -Path CHANGELOG.md -Pattern $heading -Quiet)) {
            Write-Error "CHANGELOG.md has no heading for $tag"
            exit 1
          }

          Write-Host "Release metadata OK for $tag"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: pivotkit-${{ github.sha }}
          path: release

      - name: Assemble release payload
        shell: bash
        run: |
          mkdir -p release_payload/pivotkit/mods release_payload/tools
          cp release/bin/pivotkit.dll release_payload/pivotkit.dll
          cp release/bin/pivotkit-loader.exe release_payload/pivotkit-loader.exe
          cp release/mods/* release_payload/pivotkit/mods/
          cp release/tools/pivotctl.py release_payload/tools/pivotctl.py
          cp README.md release_payload/README.md
          cp CHANGELOG.md release_payload/CHANGELOG.md
          cp LICENSE release_payload/LICENSE
          cp -r docs release_payload/docs
          cd release_payload && zip -r ../pivotkit-${GITHUB_REF_NAME}.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PivotKit ${{ github.ref_name }}"
          body: |
            PivotKit ${{ github.ref_name }} is an experimental mod loader for
            Pivot Animator 5.2.11 (32-bit).

            This is a prerelease. It can crash Pivot or damage unsaved work, so
            use it with a backup of your `.piv` files.

            Supported environment:
            - 32-bit `pivot.exe` version 5.2.11
            - Windows
            - Not affiliated with Motusoft, Peter Bone, or Pivot Animator

            Installation:
            1. Copy `pivotkit.dll` and `pivotkit-loader.exe` next to `pivot.exe`.
            2. Put mods in `pivotkit/mods/`.
            3. Run `pivotkit-loader.exe`.

            The archive includes the changelog and the full documentation. See
            `docs/GETTING_STARTED.md` for the first setup and `CHANGELOG.md` for
            the changes in this release.
          files: |
            pivotkit-*.zip
          prerelease: true
          draft: false
